<div class="flex flex-row items-center gap-4 justify-between flex-wrap">
  <div class="flex items-center bg-blue-gray-50 border border-blue-100 rounded-xl px-2 py-2 w-full max-w-xs shadow"
       style="box-shadow: 0 1.5px 7px rgba(120,120,160,0.04);">
    <span class="w-5 h-5 text-blue-400 mr-2">
      <!-- Search icon SVG -->
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="7" stroke="#607D8B" stroke-width="2"/><line x1="14" y1="14" x2="19" y2="19" stroke="#607D8B" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <input
      class="flex-1 bg-transparent border-none outline-none font-medium text-blue-gray-700 placeholder:text-blue-gray-300"
      type="search"
      [value]="search"
      (input)="onInput($event)"
      placeholder="Search profiles…" />
  </div>
  <button type="button"
    class="ml-4 px-5 py-2 font-semibold rounded-xl bg-blue-500 text-white shadow-md transition hover:bg-blue-600 focus:outline-none"
    style="border-radius: 12px; min-width: 140px;"
    (click)="create.emit()">
    + Create Profile
  </button>
</div>
