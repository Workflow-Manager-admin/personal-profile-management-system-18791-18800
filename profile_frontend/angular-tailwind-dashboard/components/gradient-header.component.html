<header class="w-full h-[58px] flex flex-row items-center justify-between px-7"
       style="background: linear-gradient(90deg, #EA4EC6 0%, #6A70DF 60%, #33D2E2 100%); border-radius: 0 0 18px 18px;">
  <div class="flex items-center">
    <span class="inline-block mr-3">
      <!-- App Logo SVG -->
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="16" fill="#EA4EC6"/>
        <text x="50%" y="57%" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700" fill="white" dy=".2em">I</text>
      </svg>
    </span>
    <span class="font-bold text-lg tracking-wide text-white drop-shadow" style="font-family:'Inter','Segoe UI',sans-serif;">{{title}}</span>
  </div>
  <button class="rounded-full bg-white bg-opacity-0 w-10 h-10 flex items-center justify-center focus:outline-none outline-none shadow"
          aria-label="User menu">
    <!-- User Circle SVG Icon -->
    <svg width="32" height="32" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14" fill="#E1E8F0" stroke="#33D2E2" stroke-width="2"/>
      <circle cx="16" cy="14" r="6" fill="#EA4EC6" />
      <ellipse cx="16" cy="22" rx="8" ry="6" fill="#F7F9FC" />
    </svg>
  </button>
</header>
